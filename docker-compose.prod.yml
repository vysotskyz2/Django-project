version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: gunicorn dealership.wsgi:application -c /app/docker/gunicorn.conf.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    networks:
      - backend
    deploy:
      replicas: ${WEB_REPLICAS:-2}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: celery -A dealership worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_volume:/app/logs
    networks:
      - backend
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-1}
      restart_policy:
        condition: on-failure

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: celery -A dealership beat --loglevel=info --schedule=/app/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_volume:/app/logs
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - logs_volume:/app/logs:ro
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
  static_volume:
  logs_volume:
