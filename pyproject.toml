[project]
name = "django-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "django-debug-toolbar (>=6.3.0,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-countries (>=8.2.0,<9.0.0)",
    "django-money (>=3.6.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "loguru (>=0.7.0,<1.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff (>=0.9.0,<1.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-django (>=4.0.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dealership.settings"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "migrations",
    "logs",
    "staticfiles",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by ruff format
    "RUF001",  # ambiguous unicode in strings (Cyrillic in Russian docs)
    "RUF002",  # ambiguous unicode in docstrings (Cyrillic in Russian docs)
    "RUF003",  # ambiguous unicode in comments (Cyrillic in Russian docs)
    "RUF012",  # mutable class attrs are the standard DRF pattern (fields, search_fields, ...)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
